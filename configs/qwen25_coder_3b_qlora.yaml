model:
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  trust_remote_code: false

data:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"

output:
  directory: "outputs/qwen25-coder-3b-tool-use"

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true
  compute_dtype: "auto"

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: "all-linear"

training:
  seed: 42
  epochs: 2
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 5
  save_strategy: "epoch"
  eval_strategy: "epoch"
  report_to: "none"
  eos_token: "<|im_end|>"

generation:
  max_new_tokens: 256

