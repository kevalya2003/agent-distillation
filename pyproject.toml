[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trajectory-distillation"
version = "0.1.0"
description = "Rejection-sampled trajectory distillation for agentic tool use"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<8.4",
]
train = [
  "torch>=2.4",
  "transformers>=4.48,<6",
  "datasets>=3,<5",
  "peft>=0.14,<1",
  "trl>=0.27,<0.28",
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
]

[project.scripts]
agent-distill = "agent_distillation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

